<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QD SMP — Minecraft Server | oyna.qd.je</title>
<meta name="description" content="Join QD SMP at oyna.qd.je. Ranks, shards, stats and a 1,000,000+ member Discord community." />
<link rel="icon" href="https://qdsmp.lovable.app/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;700;800&display=swap" />
<style>
  :root{
    --bg:#0f0f10; --card:#191a1c; --muted:#26282b; --border:#2e3033;
    --fg:#f5f6f7; --sub:#9aa0a6; --brand:#4c8dff; --shard:#b57bff; --success:#39d353;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
  .pixel{font-family:Silkscreen,monospace}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 16px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
  .card{background:var(--card);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .col3{grid-column:span 12}.col5{grid-column:span 12}.col6{grid-column:span 12}.col7{grid-column:span 12}.col12{grid-column:span 12}
  @media(min-width:860px){
    .col3{grid-column:span 3}.col5{grid-column:span 5}.col6{grid-column:span 6}.col7{grid-column:span 7}
  }
  .logo-card{display:flex;align-items:center;justify-content:center;padding:20px;aspect-ratio:1/1}
  .logo-card img{width:100%;height:auto;object-fit:contain}
  .chip{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:none;border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--fg)}
  .chip:hover{background:var(--muted)}
  .chip small{display:block;color:var(--sub);font-size:11px}
  .tile{position:relative;overflow:hidden;border-radius:24px;display:block;min-height:220px}
  .tile img{width:100%;height:100%;min-height:220px;object-fit:cover;display:block;transition:transform .5s}
  .tile:hover img{transform:scale(1.05)}
  .tile .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent,rgba(0,0,0,.3))}
  .tile .title{position:absolute;left:24px;top:18px;font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000}
  .discord{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
  .discord svg{width:44px;fill:#5865F2}
  .join{position:relative;overflow:hidden;border-radius:24px}
  .join img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
  .join .ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
  .join .inner{position:relative;padding:28px}
  .mcbox{margin-top:6px;border:2px solid #fff;background:rgba(0,0,0,.85);padding:10px 12px;width:100%;
    display:flex;align-items:center;justify-content:space-between;color:#fff;cursor:pointer}
  .lbl{color:rgba(255,255,255,.55);font-size:13px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;
    padding:14px 16px;font-weight:800;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-muted{background:var(--muted);color:var(--sub);font-size:12px;padding:11px 16px}
  .dl{display:flex;flex-direction:column;justify-content:space-between;padding:24px;gap:20px}
  footer{margin-top:80px;padding:0 16px 56px;text-align:center}
  footer nav{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center}
  footer nav a,footer nav button{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer}
  footer nav a:hover,footer nav button:hover{color:var(--fg)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:460px;width:100%;max-height:80vh;overflow:auto}
  pre{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 16px;color:var(--brand);overflow:auto}
  .toast{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:12px 16px;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .tabs{display:flex;gap:12px;justify-content:center;padding-top:24px}
  .tabs button{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:14px;padding:8px 18px;cursor:pointer}
  .tabs button.on{color:var(--fg);border-color:var(--brand)}
  .cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:24px}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;text-align:center;position:relative}
  .pcard ul{list-style:none;padding:0;margin:20px 0 0}
  .pcard li{border-bottom:1px solid var(--border);padding:8px 0;color:var(--sub);font-size:12px}
  .pcard img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated}
  .buy{margin-top:20px;width:100%;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.3);
    color:var(--fg);padding:12px;cursor:pointer}
  .buy:hover{background:var(--muted)}
  .bonus{position:absolute;left:50%;transform:translateX(-50%);top:14px;background:var(--success);color:#062;
    border-radius:6px;padding:2px 8px;font-size:10px}
  .strike{color:var(--sub);text-decoration:line-through;margin-right:8px;font-size:14px}
  input{width:100%;margin-top:6px;border-radius:12px;border:1px solid var(--border);background:var(--bg);
    color:var(--fg);padding:10px 12px;font-family:Silkscreen,monospace}
  .hidden{display:none}
</style>
</head>
<body>
<div class="tabs">
  <button id="tab-home" class="pixel on" onclick="showPage('home')">Home</button>
  <button id="tab-store" class="pixel" onclick="showPage('store')">Store</button>
</div>

<!-- HOME -->
<main id="page-home" class="wrap">
  <div class="grid">
    <div class="col3">
      <div class="card logo-card">
        <img src="https://qdsmp.lovable.app/__l5e/assets-v1/b36fb8d6-5aca-4d0f-9392-4ad26785bc66/qdsmp-logo.png" alt="QD SMP logo" />
      </div>
      <button class="chip" onclick="copyText('oyna.qd.je','Sunucu adresi')">
        <span><small class="pixel">Sunucu adresi</small><b class="pixel">oyna.qd.je</b></span>
        <span class="pixel" style="color:var(--brand)">Kopyala</span>
      </button>
    </div>

    <a class="tile col6" href="#" onclick="showPage('store');return false">
      <img src="https://qdsmp.lovable.app/__l5e/assets-v1/e7a498ad-e01d-4b83-908c-74e3c09ce147/store.jpg" alt="Store" />
      <span class="shade"></span><span class="title">Store</span>
    </a>

    <a class="card discord col3" href="https://discord.gg" target="_blank" rel="noreferrer">
      <svg viewBox="0 0 127.14 96.36" aria-hidden="true"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
      <p style="margin:18px 0 0;font-size:28px;font-weight:800">1,000,000+</p>
      <p style="margin:4px 0 0;color:var(--sub);font-size:12px">● Discord Members</p>
    </a>

    <div class="tile col5">
      <img src="https://qdsmp.lovable.app/__l5e/assets-v1/806b8412-fecd-485a-9fbd-669b6810e17f/stats.jpg" alt="Stats" />
      <span class="shade"></span><span class="title">Stats</span>
    </div>

    <section class="join col7">
      <img src="https://qdsmp.lovable.app/__l5e/assets-v1/4b3d4abd-b40f-4403-923f-bc2a82cf88f5/join.jpg" alt="" />
      <div class="ov"></div>
      <div class="inner">
        <h2 style="margin:0;color:#fff;font-size:26px">How To Join</h2>
        <p class="pixel lbl" style="margin-top:22px">Server Name</p>
        <div class="mcbox pixel" style="cursor:default">QD SMP_</div>
        <p class="pixel lbl" style="margin-top:18px">Server Address</p>
        <button class="mcbox pixel" onclick="copyText('oyna.qd.je','Sunucu adresi')">
          <span>oyna.qd.je</span><span style="color:var(--brand)">⧉</span>
        </button>
      </div>
    </section>

    
  </div>
</main>

<!-- STORE -->
<main id="page-store" class="wrap hidden">
  <header style="text-align:center">
    <img src="https://qdsmp.lovable.app/__l5e/assets-v1/b36fb8d6-5aca-4d0f-9392-4ad26785bc66/qdsmp-logo.png" alt="QD SMP logo" style="width:220px;height:auto;object-fit:contain" />
    <h1 class="pixel" style="margin:18px 0 0;font-size:40px">Store</h1>
    <p class="pixel" style="color:var(--sub)">Upgrade your experience on QD SMP</p>
    <button class="pixel" style="background:none;border:none;color:var(--brand);cursor:pointer" onclick="copyText('homes.qd.je','Adres')">homes.qd.je ⧉</button>
  </header>

  <h2 class="pixel" style="text-align:center;margin-top:56px;font-size:18px">Ranks</h2>
  <div class="cards" id="ranks"></div>

  <h2 class="pixel" style="text-align:center;margin-top:56px;font-size:18px">Shards</h2>
  <div class="cards" id="shards"></div>
</main>

<footer>
  <p class="pixel" style="font-size:28px;margin:0">homes.qd.je</p>
  <p class="pixel" style="font-size:11px;color:var(--brand);opacity:.8;margin:4px 0 0">Not associated with Mojang or Microsoft</p>
  <nav class="pixel" id="legal-nav"></nav>
</footer>

<div id="modal-root"></div>
<script>
const IMG = {
  sm:"https://qdsmp.lovable.app/__l5e/assets-v1/554c61be-2540-4752-b281-1e1797e578de/shard-sm.png",
  md:"https://qdsmp.lovable.app/__l5e/assets-v1/59115812-39dc-40d4-8cd8-a1cd1445b54e/shard-md.png",
  lg:"https://qdsmp.lovable.app/__l5e/assets-v1/80872530-ba77-49f6-837a-0351de28670e/shard-lg.png"
};
const RANKS=[
 {p:"+",price:"$4.99",perks:["9 Homes","45 Auction Slots","45 Order Slots"]},
 {p:"++",price:"$9.99",perks:["27 Homes","90 Auction Slots","90 Order Slots"]},
 {p:"+++",price:"$14.99",perks:["90 Homes","90 Auction Slots","90 Order Slots"]}
];
const SHARDS=[
 {a:"400",was:null,b:null,price:"$1.99",img:IMG.sm},
 {a:"2,500",was:null,b:null,price:"$9.99",img:IMG.sm},
 {a:"5,500",was:"5,000",b:"+10%",price:"$14.99",img:IMG.md},
 {a:"12,000",was:"10,000",b:"+20%",price:"$19.99",img:IMG.md},
 {a:"32,000",was:"25,000",b:"+28%",price:"$49.99",img:IMG.lg},
 {a:"70,000",was:"50,000",b:"+40%",price:"$99.99",img:IMG.lg}
];
const LEGAL={
 "Store Privacy Policy":"Mağaza üzerinden yapılan işlemlerde yalnızca Minecraft kullanıcı adı ve sipariş bilgileri saklanır. Ödeme verileri sunucularımızda tutulmaz.",
 "QD Privacy Policy":"Oyun içi verileriniz (istatistikler, envanter, oturum kayıtları) yalnızca sunucunun işleyişi için kullanılır ve üçüncü taraflarla paylaşılmaz.",
 "Support":"Destek için Discord sunucumuzdaki #support kanalını kullanın. Ortalama yanıt süresi 24 saattir.",
 "Terms of Service":"Sunucuya bağlanarak hile, istismar ve taciz yasağını kabul etmiş olursunuz. İhlal durumunda hesap kalıcı olarak engellenebilir.",
 "Refund Policy":"Dijital ürünler teslim edildikten sonra iade edilmez. Hatalı teslimat durumlarında 14 gün içinde destek ile iletişime geçin."
};

function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild}

document.getElementById("ranks").append(...RANKS.map(r=>el(`
  <article class="pcard">
    <h3 class="pixel" style="font-size:24px;margin:0">QD<span style="color:var(--brand)">${r.p}</span></h3>
    <ul class="pixel">${r.perks.map(p=>`<li>${p}</li>`).join("")}</ul>
    <button class="buy pixel" data-name="QD${r.p}" data-price="${r.price}" data-detail="USD /month">${r.price} <small style="color:var(--sub)">USD /month</small></button>
  </article>`)));

document.getElementById("shards").append(...SHARDS.map(s=>el(`
  <article class="pcard">
    ${s.b?`<span class="bonus pixel">${s.b}</span>`:""}
    <img src="${s.img}" alt="${s.a} shards" loading="lazy" />
    <p class="pixel" style="color:var(--shard);font-size:18px">${s.was?`<span class="strike">${s.was}</span>`:""}${s.a} Shards</p>
    <button class="buy pixel" data-name="${s.a} Shards" data-price="${s.price}" data-detail="USD one-time">${s.price} <small style="color:var(--sub)">USD</small></button>
  </article>`)));

document.getElementById("legal-nav").append(...Object.keys(LEGAL).map(k=>{
  const b=el(`<button>${k}</button>`);b.onclick=()=>openLegal(k);return b;
}), el(`<a href="/api/public/download/html" download="qdsmp-website.html" style="color:var(--brand)">Download this HTML</a>`));

document.addEventListener("click",e=>{
  const b=e.target.closest(".buy"); if(!b) return;
  openCheckout(b.dataset.name,b.dataset.price,b.dataset.detail);
});

function showPage(p){
  document.getElementById("page-home").classList.toggle("hidden",p!=="home");
  document.getElementById("page-store").classList.toggle("hidden",p!=="store");
  document.getElementById("tab-home").classList.toggle("on",p==="home");
  document.getElementById("tab-store").classList.toggle("on",p==="store");
  window.scrollTo(0,0);
}
function toast(msg,desc){
  const t=el(`<div class="toast"><b>${msg}</b>${desc?`<div style="color:var(--sub);font-size:12px">${desc}</div>`:""}</div>`);
  document.body.append(t); setTimeout(()=>t.remove(),2500);
}
async function copyText(v,label){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);}
    else{const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";
      document.body.append(ta);ta.select();document.execCommand("copy");ta.remove();}
    toast(label+" kopyalandı!",v);
  }catch(_){toast("Kopyalanamadı","Manuel olarak kopyalayın: "+v);}
}
function modal(html){
  const root=document.getElementById("modal-root");
  const m=el(`<div class="modal"><div class="box">${html}</div></div>`);
  m.onclick=e=>{if(e.target===m)root.innerHTML=""};
  root.innerHTML=""; root.append(m); return m;
}
function openHelp(){
  modal(`<h3 class="pixel" style="margin:0">Nasıl çalıştırılır?</h3>
  <p style="color:var(--sub);font-size:14px">Bu tek dosyalık sürümü çift tıklayarak doğrudan tarayıcıda açabilirsiniz. Kaynak kod sürümü için:</p>
  <pre class="pixel">npm install\nnpm run dev</pre>
  <button class="btn btn-muted" style="margin-top:16px;width:100%" onclick="document.getElementById('modal-root').innerHTML=''">Kapat</button>`);
}
function openLegal(k){
  modal(`<h3 class="pixel" style="margin:0">${k}</h3>
  <p style="color:var(--sub);font-size:14px;line-height:1.6">${LEGAL[k]}</p>
  <button class="btn btn-muted" style="margin-top:16px;width:100%" onclick="document.getElementById('modal-root').innerHTML=''">Kapat</button>`);
}
function openCheckout(name,price,detail){
  const m=modal(`<h3 class="pixel" style="margin:0">Checkout</h3>
    <div style="margin-top:20px;display:flex;justify-content:space-between;background:rgba(0,0,0,.35);border-radius:12px;padding:14px">
      <span class="pixel">${name}</span><span class="pixel" style="color:var(--brand)">${price} <small style="color:var(--sub)">${detail}</small></span>
    </div>
    <label class="pixel" style="display:block;margin-top:18px;font-size:12px;color:var(--sub)">Minecraft Username</label>
    <input id="ign" placeholder="Steve" />
    <button id="addcart" class="btn btn-primary pixel" style="margin-top:20px;width:100%">Add to cart</button>
    <p class="pixel" style="text-align:center;font-size:10px;color:var(--sub)">Demo checkout — no real payment is taken.</p>`);
  m.querySelector("#addcart").onclick=()=>{
    const u=m.querySelector("#ign").value.trim();
    if(!u){toast("Kullanıcı adı gerekli","Minecraft kullanıcı adını gir.");return;}
    toast("Sepete eklendi!",`${name} — ${price} (${u})`);
    document.getElementById("modal-root").innerHTML="";
  };
}
</script>
</body>
</html>
